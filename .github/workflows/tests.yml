name: tests

# Refactor Phase 2.4. Unit suite first because it takes a second and fails fast;
# the Playwright suite then runs against a real production build, so a build
# regression fails CI rather than passing in dev and breaking on deploy.
#
# See docs/03-refactor-plan.md Phase 2 and docs/04-e2e-test-plan.md section 3.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # resources/vecteezy_flat-world-map-.../ produces 123-character paths.
          # Harmless on Linux; noted because a Windows runner needs core.longpaths.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generated data files are current
        # resources/adjacency.json and pathAreas.json are generated by tools/.
        # If someone edits the JSON by hand, or edits svgMaster.svg without
        # regenerating, this is where it surfaces -- before any spec runs against
        # stale geometry.
        run: npm run build:adjacency:check && npm run build:areas:check

      - run: npm run test:unit

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit
    env:
      # The brief asks for 8 headless workers. Measured on the author's machine 8
      # is not stable for this suite (15/28 vs 27/28 at four), so the default is 4
      # -- see docs/04-e2e-test-plan.md section 3.5. CI runners are smaller still,
      # so this stays at 4 until someone measures a runner and raises it
      # deliberately.
      DWC_WORKERS: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the suite
        # scripts/run-tests.cjs builds, serves the build, runs Playwright into a
        # timestamped folder and writes summary.md. `npm run test:e2e` is exactly
        # what a developer runs locally, so CI and local runs cannot drift.
        run: npm run test:e2e

      - name: Upload the run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-reports/runs/
          retention-days: 14

      - name: Summarise in the job page
        if: always()
        shell: bash
        run: |
          latest=$(ls -1d test-reports/runs/*/ 2>/dev/null | sort | tail -1)
          if [ -n "$latest" ] && [ -f "$latest/summary.md" ]; then
            cat "$latest/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary.md was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
