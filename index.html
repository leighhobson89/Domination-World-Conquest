    <script>
        // Test-only, and only with ?e2e=1. A classic inline script so it runs before
        // the deferred module scripts below -- the game seeds RNG at module-evaluation
        // time (initial gold, starting forts, leader generation), so anything later
        // would be too late. See docs/03-refactor-plan.md Phase 1.6.
        (function () {
            var params = new URLSearchParams(window.location.search);
            if (!params.has("e2e")) return;
            window.__seedRandom = function (seed) {
                var h = 2166136261 >>> 0;
                var text = String(seed);
                for (var i = 0; i < text.length; i++) {
                    h ^= text.charCodeAt(i);
                    h = Math.imul(h, 16777619);
                }
                var a = h >>> 0;
                Math.random = function () {
                    a |= 0; a = (a + 0x6D2B79F5) | 0;
                    var t = Math.imul(a ^ (a >>> 15), 1 | a);
                    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
                };
                window.__seed = text;
            };
            if (params.has("seed")) window.__seedRandom(params.get("seed"));
        })();
    </script>
